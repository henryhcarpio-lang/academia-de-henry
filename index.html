<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Academia de Henry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilos.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>AH</text></svg>">
</head>
<body>

<header class="barra">
  <div class="marca">
    <span class="logo" aria-hidden="true">AH</span>
    <h1>Academia de Henry</h1>
  </div>

  <div class="buscador">
    <svg class="icono buscador-icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="busqueda" placeholder="Buscar en tus guías…" autocomplete="off">
  </div>

  <div class="acciones">
    <button class="btn btn-principal" id="btn-subir" title="Subir una guía">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
      <span>Subir guía</span>
    </button>
    <button class="btn btn-icono" id="btn-temas" title="Gestionar temas">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.59-4.59a2 2 0 0 0 0-2.58z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
    </button>
    <button class="btn btn-icono" id="btn-ajustes" title="Ajustes y acceso de escritura">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="btn btn-icono" id="btn-tema-visual" title="Cambiar apariencia">
      <svg class="icono icono-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icono icono-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<nav class="filtros" id="filtros"></nav>

<main id="principal">
  <div class="rejilla" id="rejilla"></div>
  <div class="vacio" id="vacio" hidden>
    <div class="vacio-ilustracion" aria-hidden="true">
      <svg class="icono icono-grande" viewBox="0 0 24 24"><path d="M2 5c3-2 7-2 10 0v14c-3-2-7-2-10 0z"/><path d="M22 5c-3-2-7-2-10 0v14c3-2 7-2 10 0z"/></svg>
    </div>
    <h2>Todavía no hay guías</h2>
    <p>Arrastra un archivo HTML, una carpeta o un .zip a cualquier parte de esta ventana.</p>
    <button class="btn btn-principal" id="btn-vacio-subir">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
      <span>Subir mi primera guía</span>
    </button>
  </div>
</main>

<!-- Capa de arrastre -->
<div class="soltar" id="soltar" hidden>
  <div class="soltar-caja">
    <div class="soltar-icono" aria-hidden="true">
      <svg class="icono icono-grande" viewBox="0 0 24 24"><path d="M7 18a4.6 4.4 0 0 1-1.5-9 5 4.5 0 0 1 9.5-1.8 4 4 0 0 1 3.5 4.3 4 4 0 0 1-1.5 7.5"/><path d="M12 12v6"/><path d="m9 15 3-3 3 3"/></svg>
    </div>
    <p class="soltar-texto">Suelta aquí tus guías</p>
    <p class="soltar-nota">Archivos .html, carpetas completas o .zip</p>
  </div>
</div>

<!-- Lector -->
<section class="lector" id="lector" hidden>
  <header class="lector-barra">
    <button class="btn btn-icono" id="lector-volver" title="Volver a la biblioteca">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </button>
    <div class="lector-titulo">
      <h2 id="lector-nombre"></h2>
      <span class="etiqueta" id="lector-tema"></span>
    </div>
    <div class="acciones">
      <button class="btn" id="lector-notas">
        <svg class="icono icono-mini" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span>Nota</span>
      </button>
      <button class="btn btn-icono" id="lector-descargar" title="Descargar como HTML">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
      <button class="btn btn-icono btn-peligro" id="lector-borrar" title="Eliminar guía">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </button>
    </div>
  </header>
  <div class="lector-cuerpo">
    <iframe id="lector-marco" sandbox="allow-scripts allow-popups" title="Contenido de la guía"></iframe>
    <aside class="notas" id="panel-notas" hidden>
      <label for="nota-texto">Tu nota sobre esta guía</label>
      <textarea id="nota-texto" placeholder="Lo que quieras recordar: dudas, ideas, en qué te sirvió…"></textarea>
      <p class="notas-estado" id="nota-estado"></p>
    </aside>
  </div>
</section>

<!-- Diálogo genérico -->
<div class="modal" id="modal" hidden>
  <div class="modal-caja" id="modal-caja"></div>
</div>

<p class="aviso" id="aviso" hidden></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
